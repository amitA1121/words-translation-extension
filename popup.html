<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>מילון מילים</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>המילים שלי</h1>
    <span id="wh-count" class="wh-count">0</span>
  </header>

  <button id="wh-open-pdf" class="wh-open-pdf-btn" hidden>
    פתח PDF זה במילון (עם סימון מילים)
  </button>

  <div class="wh-tools-row">
    <button id="wh-open-dict" class="wh-open-dict-btn">
      🔤 מילון מתקדם
    </button>
    <button id="wh-open-review" class="wh-open-review-btn">
       שינון מילים 🎴
    </button>
  </div>

  <button id="wh-export-pdf" class="wh-export-pdf-btn">
    📄 ייצוא הרשימה ל-PDF
  </button>

  <div id="wh-review-overlay" class="wh-dict-overlay" hidden>
    <div class="wh-review-dialog">
      <div class="wh-dict-header">
        <button id="wh-review-close" class="wh-dict-close-btn" title="סגור">✕</button>
        <span class="wh-dict-title">מצב חזרה</span>
        <span id="wh-review-progress" class="wh-review-progress"></span>
      </div>

      <div id="wh-review-body" class="wh-review-body">
        <div id="wh-review-empty" class="wh-review-empty" hidden>
          אין מילים ללימוד כרגע.<br />
          כל המילים שלך מסומנות כנלמדות, או שאין מילים שמורות.
        </div>

        <div id="wh-review-card-wrap" class="wh-review-card-wrap" hidden>
          <div id="wh-review-card" class="wh-review-card">
            <div class="wh-review-word-row">
              <div id="wh-review-word" class="wh-review-word"></div>
              <button id="wh-review-speak" class="wh-review-speak-btn" title="השמע הגייה">🔊</button>
            </div>
            <div id="wh-review-translation" class="wh-review-translation" hidden></div>
            <div class="wh-review-hint">לחץ על הכרטיס לחשיפת התרגום</div>
          </div>

          <div class="wh-review-actions">
            <button id="wh-review-know" class="wh-review-know-btn" hidden>✓ ידעתי</button>
            <button id="wh-review-dont-know" class="wh-review-dont-know-btn" hidden>✗ לא ידעתי</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="wh-dict-overlay" class="wh-dict-overlay" hidden>
    <div class="wh-dict-dialog">
      <div class="wh-dict-header">
        <button id="wh-dict-close" class="wh-dict-close-btn" title="סגור">✕</button>
        <span class="wh-dict-title">מילון מתקדם</span>
        <span class="wh-dict-spacer"></span>
      </div>

      <div class="wh-dict-lang-row">
        <button id="wh-dict-lang-from" class="wh-dict-lang-btn" data-lang="en">אנגלית</button>
        <button id="wh-dict-swap" class="wh-dict-swap-btn" title="החלף כיוון">⇄</button>
        <button id="wh-dict-lang-to" class="wh-dict-lang-btn" data-lang="he">עברית</button>
      </div>

      <div class="wh-dict-input-row">
        <input id="wh-dict-input" class="wh-dict-input" type="text" placeholder="הקלד מילה..." />
        <button id="wh-dict-speak" class="wh-dict-speak-btn" title="השמע הגייה">🔊</button>
      </div>

      <div id="wh-dict-results" class="wh-dict-results"></div>
    </div>
  </div>

  <div class="wh-search-wrap">
    <input id="wh-search" class="wh-search-input" type="text" placeholder="חיפוש מילה..." />
  </div>

  <div class="wh-toolbar-wrap">
    <select id="wh-sort" class="wh-sort-select">
      <option value="date-desc">חדש קודם</option>
      <option value="date-asc">ישן קודם</option>
      <option value="alpha-asc">א-ב (א עד ת)</option>
      <option value="alpha-desc">א-ב (ת עד א)</option>
      <option value="views-desc">הכי נצפות</option>
    </select>
    <label class="wh-filter-toggle">
      <input id="wh-filter-unlearned" type="checkbox" />
      <span>רק לא נלמדות</span>
    </label>
  </div>

  <div id="wh-stats" class="wh-stats"></div>

  <div id="wh-empty" class="wh-empty" hidden>
    עדיין לא סימנת מילים.<br />
    לחץ על מילה באנגלית באתר, וסמן אותה כדי שתופיע כאן.
  </div>

  <div id="wh-no-results" class="wh-empty" hidden>
    לא נמצאו מילים תואמות.
  </div>

  <ul id="wh-list" class="wh-list"></ul>

  <script src="jspdf/jspdf.umd.min.js"></script>
  <script src="fonts/notosanshebrew-font.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
